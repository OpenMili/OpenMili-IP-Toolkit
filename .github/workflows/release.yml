name: Portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON runner array for native verification (empty means all)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: runner.os != 'Windows'
      - run: npm test
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - run: npm run smoke
      - run: npm run build:bundle
      - run: node scripts/verify-bundle.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Check tag matches version and combine hashes
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
          cp ../install.sh ../install.ps1 ../uninstall.sh ../uninstall.ps1 .
          sha256sum install.sh install.ps1 uninstall.sh uninstall.ps1 >> SHA256SUMS
      - name: Publish tested portable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/uninstall.sh dist/uninstall.ps1 --title "OpenMili-IP-Toolkit $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
  verify-published-installers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENMILI_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public shell installer and bundled runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --version "$OPENMILI_TAG" --root "$RUNNER_TEMP/openmili-public-install"
          "$RUNNER_TEMP/openmili-public-install/openmili-ip" doctor --offline --json --output "$RUNNER_TEMP/doctor.json" > "$RUNNER_TEMP/stdout.json"
          "$RUNNER_TEMP/openmili-public-install/openmili-ip" uninstall --yes
          test ! -e "$RUNNER_TEMP/openmili-public-install/current.txt"
      - name: Verify public PowerShell installer and deferred owned cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPath=Join-Path $env:RUNNER_TEMP 'openmili-public-install'
          & ./install.ps1 -Version $env:OPENMILI_TAG -InstallRoot $installPath -Yes
          & (Join-Path $installPath 'openmili-ip.cmd') doctor --offline --json --output (Join-Path $env:RUNNER_TEMP 'doctor.json')
          if($LASTEXITCODE -ne 0){throw 'Portable doctor failed'}
          Set-Content -LiteralPath (Join-Path $installPath 'keep-user-file.txt') -Value 'user data'
          & (Join-Path $installPath 'openmili-ip.cmd') uninstall --yes
          if($LASTEXITCODE -ne 0){throw 'Portable uninstall failed'}
          $owned=@('current.txt','versions','launch.ps1','openmili-ip','openmili-ip.cmd','.openmili-install.json')
          for($attempt=0;$attempt -lt 40;$attempt++){
            $remaining=@($owned | Where-Object {Test-Path -LiteralPath (Join-Path $installPath $_)})
            if(!$remaining.Count){break}
            $errorFile=Join-Path $installPath '.openmili-uninstall-error.txt'
            if(Test-Path -LiteralPath $errorFile){throw (Get-Content -LiteralPath $errorFile -Raw)}
            Start-Sleep -Milliseconds 250
          }
          if($remaining.Count){throw "Deferred cleanup did not finish: $remaining"}
          if((Get-Content -LiteralPath (Join-Path $installPath 'keep-user-file.txt') -Raw).Trim() -ne 'user data'){throw 'User file was not preserved'}
