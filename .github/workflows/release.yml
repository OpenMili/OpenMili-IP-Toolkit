name: Portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON runner array for native verification (empty means all)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - run: npm run smoke
      - run: npm run build:bundle
      - run: node scripts/verify-bundle.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Check tag matches version and combine hashes
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          cat dist/*.sha256 > dist/SHA256SUMS
          cd dist
          sha256sum -c SHA256SUMS
          cp ../install.sh ../install.ps1 ../uninstall.sh ../uninstall.ps1 .
          sha256sum install.sh install.ps1 uninstall.sh uninstall.ps1 >> SHA256SUMS
      - name: Publish tested portable archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/uninstall.sh dist/uninstall.ps1 --title "OpenMili-IP-Toolkit $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --verify-tag
