name: Cross-platform checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        if: runner.os != 'Windows'
      - run: npm test
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - name: Real Linux IPv4 and IPv6 traceroute protocols
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y traceroute
          sudo "$(command -v node)" tests/live-route-smoke.cjs
      - name: Real authorized SSH Agent
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y openssh-server
          bash tests/live-agent-smoke.sh
      - run: npm run smoke
      - run: npm pack --dry-run
      - name: Install GitHub archive outside checkout
        working-directory: ${{ runner.temp }}
        run: npx --yes --allow-remote=root --package=https://github.com/OpenMili/OpenMili-IP-Toolkit/archive/${{ github.sha }}.tar.gz openmili-ip --help
